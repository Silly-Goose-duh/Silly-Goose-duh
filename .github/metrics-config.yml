# lowlighter/metrics config
# Brand-matched to the neuro.ad palette: orange #BE5205, gold #F59E0B, cream #FFFDE1.
# Kept deliberately restrained -- fewer plugins means fewer API requests and no
# "not enough data" noise on a young account.

template: false
community: false
follows: false
stars: false
issues: true
prs: true
contributors: true
repositories: true
projects: false
discussions: false

custom_theme: |
  backgroundColor: "#111111"
  titleColor: "#F59E0B"
  textColor: "#FFFDE1"
  iconColor: "#BE5205"
  logoColor: "#BE5205"
  arrowColor: "#BE5205"
  lineColor: "#2a2a2a"

plugins:
  - base
  - header
  - summary
  - languages
  - activity
  - repositories
  - metadata

plugin_features:
  base: header
  languages: chart
  repositories: list
  metadata: since

counters:
  enabled: false

loading: disabled
